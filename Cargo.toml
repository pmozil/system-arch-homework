[package]
name = "software-arch-homework"
version = "0.1.0"
edition = "2021"

[dependencies]
tokio = { version = "1.0", features = ["full"] }
tokio-sync = "0.1"
axum = "0.7"
reqwest = { version = "0.11", features = ["json"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
uuid = { version = "1.0", features = ["v4"] }
dashmap = "5.5"
axum-server = "0.7.1"
tonic = "0.12.3"
prost = "0.13.4"

[build-dependencies]
tonic-build = "0.12.3"


[[bin]]
name = "facade-service"
path = "src/facade-service.rs"

[[bin]]
name = "logging-service"
path = "src/logging-service.rs"

[[bin]]
name = "message-service"
path = "src/message-service.rs"
