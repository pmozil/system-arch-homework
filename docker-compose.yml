version: "3.8"

services:
  # Controllers
  controller-1:
    image: apache/kafka:latest
    container_name: controller-1
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: controller
      KAFKA_LISTENERS: CONTROLLER://:9093
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@controller-1:9093,2@controller-2:9093,3@controller-3:9093
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0

  controller-2:
    image: apache/kafka:latest
    container_name: controller-2
    environment:
      KAFKA_NODE_ID: 2
      KAFKA_PROCESS_ROLES: controller
      KAFKA_LISTENERS: CONTROLLER://:9093
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@controller-1:9093,2@controller-2:9093,3@controller-3:9093
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0

  controller-3:
    image: apache/kafka:latest
    container_name: controller-3
    environment:
      KAFKA_NODE_ID: 3
      KAFKA_PROCESS_ROLES: controller
      KAFKA_LISTENERS: CONTROLLER://:9093
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@controller-1:9093,2@controller-2:9093,3@controller-3:9093
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0

  broker-1:
    image: apache/kafka:latest
    container_name: broker-1
    ports:
      - 29092:9092
    environment:
      KAFKA_NODE_ID: 4
      KAFKA_PROCESS_ROLES: broker
      KAFKA_LISTENERS: 'PLAINTEXT://:19092,PLAINTEXT_HOST://:9092'
      KAFKA_ADVERTISED_LISTENERS: 'PLAINTEXT://broker-1:19092,PLAINTEXT_HOST://localhost:29092'
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@controller-1:9093,2@controller-2:9093,3@controller-3:9093
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
    depends_on:
      - controller-1
      - controller-2
      - controller-3

  # Message Service (two instances)
  message-service-1:
    build:
      context: ./message-service
    container_name: message-service-1
    environment:
      KAFKA_BROKER_URL: "broker-1:19092"
      KAFKA_TOPIC: "messages"
    depends_on:
      - broker-1
    networks:
      - kafka-net

  message-service-2:
    build:
      context: ./message-service
    container_name: message-service-2
    environment:
      KAFKA_BROKER_URL: "broker-1:19092"
      KAFKA_TOPIC: "messages"
    depends_on:
      - broker-1
    networks:
      - kafka-net

  # Hazelcast Service
  hazelcast:
    image: hazelcast/hazelcast:latest
    container_name: hazelcast
    environment:
      - JAVA_OPTS=-Dhazelcast.local.localAddress=hazelcast
    ports:
      - "5701:5701"
    networks:
      - kafka-net

  logging_service_1:
    build:
      context: ./logging_service
    container_name: logging_service_1
    depends_on:
      - hazelcast

  logging_service_2:
    build:
      context: ./logging_service
    container_name: logging_service_2
    depends_on:
      - hazelcast
    networks:
      - kafka-net

  logging_service_3:
    build:
      context: ./logging_service
    container_name: logging_service_3
    depends_on:
      - hazelcast
    networks:
      - kafka-net

  # Config server
  config_server:
    build:
      context: ./config_server
    container_name: config_server
    networks:
      - kafka-net

  # Facade Service
  facade-service:
    build:
      context: ./facade-service
    container_name: facade-service
    environment:
      KAFKA_BROKER_URL: "broker-1:19092"
      KAFKA_TOPIC: "messages"
    depends_on:
      - logging_service_1
      - logging_service_2
      - logging_service_3
      - message-service-1
      - message-service-2
      - config_server
    networks:
      - kafka-net
    ports:
      - "8000:8000"

networks:
  kafka-net:
